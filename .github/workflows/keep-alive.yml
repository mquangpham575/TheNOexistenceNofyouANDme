name: Keep-Alive Supabase

on:
  schedule:
    # Run every 2 days to ensure Supabase doesn't pause (7-day limit)
    - cron: "0 0 */2 * *"
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd backend && bun install

      - name: Generate Prisma Client
        run: cd backend && bunx prisma generate

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Run Keep-Alive Script
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          cd backend
          infisical run --env=dev -- bun run tsx src/scripts/keep-alive.ts

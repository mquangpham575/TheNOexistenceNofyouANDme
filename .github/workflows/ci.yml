name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Debug OIDC Environment
        run: echo "Current Repo is ${{ github.repository }} on ref ${{ github.ref }}"

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.8
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-slug: nonexist
          env-slug: dev
          domain: https://app.infisical.com
          export-type: env

      - name: Build
        working-directory: frontend
        run: bun run build

  backend:
    name: Backend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Debug OIDC Environment
        run: echo "Current Repo is ${{ github.repository }} on ref ${{ github.ref }}"

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.8
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-slug: nonexist
          env-slug: dev
          domain: https://app.infisical.com
          export-type: env

      - name: Build
        working-directory: backend
        run: bun run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: nonexist-app:latest

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: nonexist-api:latest

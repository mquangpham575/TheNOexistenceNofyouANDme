name: Build and Push Docker Image

on:
  workflow_dispatch: # Manual trigger for testing
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write # Required for OIDC authentication
  contents: read # Required for checking out code

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Debug OIDC Environment
        run: echo "Current Repo is ${{ github.repository }} on ref ${{ github.ref }}"

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: 940ba67f-b200-4787-b2d2-4a1532e613fd
          domain: https://app.infisical.com
          project-slug: "nonexist-y1c-c"
          env-slug: dev

      - name: Build
        working-directory: frontend
        run: bun run build

  backend:
    name: Backend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Debug OIDC Environment
        run: echo "Current Repo is ${{ github.repository }} on ref ${{ github.ref }}"

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: 940ba67f-b200-4787-b2d2-4a1532e613fd
          domain: https://app.infisical.com
          project-slug: "nonexist-y1c-c"
          env-slug: dev

      - name: Build
        working-directory: backend
        run: bun run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: nonexist-app:latest

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: nonexist-api:latest
